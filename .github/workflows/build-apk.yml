name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==1.1.2"

      - name: Build APK
        run: flet build apk --project netpult --module-name main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netpult-apk
          path: build/apk/*.apk
          if-no-files-found: error
